services:
  # Web service voor de multiplayer game server
  - type: web
    name: muziek-raad-spel
    env: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm run server
    envVars:
      - key: PORT
        value: 3001
      - key: NODE_ENV
        value: production
      - key: SOCKET_URL
        sync: false
